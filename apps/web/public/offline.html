<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Shikigami · offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff;
        color: #182026; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 320px; padding: 24px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 16px 0 6px; }
      p { color: #5e676f; margin: 0 0 20px; }
      button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #0e5a64;
        color: #fff; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Shikigami needs the internet to chat and pay. Nothing was sent or charged.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
