[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]

[rpc_endpoints]
hedera_testnet = "https://testnet.hashio.io/api"

[fmt]
line_length = 100

[invariant]
runs = 128
depth = 64

[lint]
# block-timestamp: Hedera timestamps come from network consensus; windows are minutes or longer.
# require-revert-in-loop: intended, one bad entry rejects the whole call.
# reentrancy-events: the only calls before our events are ERC-1271 checks (staticcall).
# environment-read-across-mutation: tests read block.timestamp after vm.warp on purpose (no via-ir).
exclude_lints = [
  "block-timestamp",
  "require-revert-in-loop",
  "reentrancy-events",
  "environment-read-across-mutation",
]
